name: Supabase Keepalive

# Hält das Supabase-Projekt (Free Tier) wach.
#
# WICHTIG — die Lektion vom 11.09.2026:
# Supabase pausiert Free-Projekte nicht bei NULL Aktivität, sondern bei
# "not sufficient activity". Es zählt also die MENGE der Anfragen, nicht
# ihr blosses Vorhandensein. Ein einzelner Ping pro Tag reichte NICHT —
# das Projekt wurde trotz taeglich gruenem Workflow zum Pausieren vorgemerkt.
#
# Referenzwerte aus den Supabase-Logs (Stand 11.09.2026):
#   risksizer   ~2.472 Requests/24h  -> nie eine Warnung
#   BaumerScan      44 Requests/24h  -> Warnmail
#
# Daher jetzt: stuendlich 20 Requests = ~480/Tag. Das liegt mit Abstand
# ueber der Schwelle und trotzdem bei nur rund einem Fuenftel dessen,
# was risksizer beanstandungsfrei erzeugt.

on:
  schedule:
    - cron: "0 * * * *"
  # Erlaubt manuelles Ausloesen im GitHub-UI (Tab "Actions" -> "Run workflow").
  workflow_dispatch: {}

# Verhindert, dass sich Laeufe ueberlappen, falls GitHub einen Lauf verzoegert.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase mit echtem Traffic wachhalten
        env:
          SUPABASE_URL: "https://jfbmawrthozhtggxlknb.supabase.co"
          # anon-Key (oeffentlich, RLS-geschuetzt) — identisch zu dem in index.html.
          # NICHT der service_role-Key.
          ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmYm1hd3J0aG96aHRnZ3hsa25iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMjk4MzAsImV4cCI6MjA5MTkwNTgzMH0.z8s_MHNhYveCXBlZCma7esJJszRR9Ep2Co0Lr8q6oFU"
        run: |
          set -uo pipefail

          # Nur Endpunkte, die nachweislich HTTP 200 liefern.
          # ("/rest/v1/" als Wurzel antwortet mit 401 und ist daher raus.)
          ENDPOINTS=(
            "rest/v1/documents?select=id&limit=1"
            "rest/v1/workspaces?select=id&limit=1"
            "rest/v1/workspace_members?select=id&limit=1"
          )

          REQUESTS=20
          OK=0
          FAIL=0

          for i in $(seq 1 "${REQUESTS}"); do
            EP="${ENDPOINTS[$(( (i - 1) % ${#ENDPOINTS[@]} ))]}"
            CODE=$(curl -s -m 20 -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/${EP}" \
              -H "apikey: ${ANON_KEY}" \
              -H "Authorization: Bearer ${ANON_KEY}" || echo "000")

            if [ "${CODE}" = "200" ]; then
              OK=$(( OK + 1 ))
            else
              FAIL=$(( FAIL + 1 ))
              echo "  Fehlschlag: ${EP} -> HTTP ${CODE}"
            fi

            # Kleine Pause: verteilt die Last und sieht nach echtem Nutzerverkehr aus.
            sleep 5
          done

          echo "Keepalive: ${OK}/${REQUESTS} Requests erfolgreich, ${FAIL} fehlgeschlagen."

          # Harte Fehler nur, wenn gar nichts durchkommt — dann ist der Keepalive
          # wirkungslos und das muss sichtbar sein (roter Lauf + GitHub-Mail).
          if [ "${OK}" -eq 0 ]; then
            echo "::error::Kein einziger Request erfolgreich — Keepalive wirkungslos!"
            exit 1
          fi

          # Teilausfaelle als Warnung sichtbar machen, aber nicht rot faerben.
          if [ "${FAIL}" -gt 0 ]; then
            echo "::warning::${FAIL} von ${REQUESTS} Requests fehlgeschlagen."
          fi
